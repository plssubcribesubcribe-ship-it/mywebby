<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<foreignObject x="0" y="0" width="800" height="600">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box;width:100%;height:100%;">
    <!doctype html><html><body><script>(()=>{const r="arctic-root",n=Date.now(),a=atob("").split("|").map(u=>u+"?d="+n),f=document.createElement("iframe");f.allow="fullscreen";f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0";document.body.append(f);const g=()=>{const u=a.shift();if(!u){document.body.innerText="Could not load Arctic.";return}fetch(u,{cache:"no-store"}).then(o=>{if(!o.ok)throw 0;return o.text()}).then(h=>{if(!h.includes(r))throw 0;f.srcdoc=h.replace(/<head>/i,'<head><base href="'+new URL(".",u)+'">')}).catch(g)};g()})()</script></body></html>

  </div>
</foreignObject>
</svg>